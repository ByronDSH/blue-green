  name: CI/CD Blue-Green

  on:
    push:
      branches:
        - main

  jobs:
    ci:
      name: Integracion continua
      runs-on: ubuntu-latest

      steps:
        - name: Descargar codigo
          uses: actions/checkout@v4

        - name: Configurar Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.12"

        - name: Validar sintaxis de Python
          run: python -m py_compile app.py

        - name: Ejecutar pruebas basicas
          run: |
            python -c "from app import crear_servidor; print('Código válido')"